<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login - Elder Day Care & Senior Activity Center</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration for Dark Mode & Custom Colors -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#fce7f3', 
              DEFAULT: '#f472b6', 
              dark: '#db2777', 
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 font-sans min-h-screen min-h-[100dvh] w-full relative flex flex-col items-center justify-center p-4 py-6 sm:py-10 overflow-x-hidden overflow-y-auto">

  <!-- BACKGROUND EFFECTS -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
      <!-- Soft Brand Blobs -->
      <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-brand/20 dark:bg-brand/10 blur-[120px]"></div>
      <div class="absolute top-[60%] -right-[10%] w-[40%] h-[50%] rounded-full bg-purple-500/10 blur-[120px]"></div>
      
      <!-- Subtle Pattern -->
      <div class="absolute inset-0 opacity-20 dark:opacity-5" style="background-image: radial-gradient(circle at 2px 2px, #f472b6 1px, transparent 0); background-size: 32px 32px;"></div>
  </div>

  <!-- TOP NAVIGATION CONTROLS (Back to Home, Dark mode, RTL) -->
  <div class="w-full max-w-4xl flex items-center justify-between mb-3 sm:mb-4 px-1 z-20">
      <a href="index.html" class="h-10 inline-flex items-center gap-2 px-3.5 sm:px-4 rounded-full bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border border-gray-200/80 dark:border-gray-700/80 text-gray-700 dark:text-gray-300 hover:bg-brand hover:text-white dark:hover:bg-brand dark:hover:text-white hover:border-brand transition-all text-xs sm:text-sm font-semibold shadow-sm group">
          <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-0.5 rtl:group-hover:translate-x-0.5 rtl:rotate-180"></i>
          <span>Home</span>
      </a>
      <div class="flex items-center gap-2 sm:gap-2.5">
          <button id="darkToggleBtn" class="w-10 h-10 rounded-full bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border border-gray-200/80 dark:border-gray-700/80 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-brand hover:text-white dark:hover:bg-brand hover:border-brand transition-all shadow-sm text-sm" title="Toggle dark mode" aria-label="Toggle dark mode">
              🌙
          </button>
          <button id="rtlToggleBtn" class="h-10 min-w-[40px] px-3 sm:px-3.5 rounded-full bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border border-gray-200/80 dark:border-gray-700/80 flex items-center justify-center text-gray-600 dark:text-gray-300 font-bold text-xs hover:bg-brand hover:text-white dark:hover:bg-brand hover:border-brand transition-all shadow-sm" title="Toggle RTL/LTR" aria-label="Toggle text direction">
              LTR
          </button>
      </div>
  </div>

  <!-- CENTERED CARD -->
  <div class="w-full max-w-4xl bg-white/80 dark:bg-gray-800/80 backdrop-blur-2xl border border-white/40 dark:border-gray-700/50 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] flex flex-col md:flex-row overflow-hidden relative z-10">
      
      <!-- FORM SIDE -->
      <div class="w-full md:w-1/2 p-6 sm:p-10 flex flex-col justify-center">
          <div class="mb-8 text-center">
              <!-- ELDER CARE LOGO EXACTLY SAME AS INDEX.HTML -->
              <a href="index.html" class="inline-flex items-center justify-center gap-3 no-underline group mb-8 mx-auto">
                <div class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center transition-transform group-hover:scale-105 shadow-md">
                  <i class="fa-solid fa-hands-holding-circle text-white text-xl"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
                  Elder<span class="text-brand">Care</span>
                </span>
              </a>
              <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2 tracking-tight">Welcome Back</h2>
              <p class="text-gray-500 dark:text-gray-400 text-sm">Please log in to your family portal.</p>
          </div>

          <!-- GOOGLE LOGIN -->
          <button type="button" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-gray-700 dark:text-gray-200 text-sm font-bold hover:bg-gray-50 dark:hover:bg-gray-600 transition-all mb-3 shadow-sm hover:shadow">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
              Log in with Google
          </button>

          <!-- APPLE LOGIN -->
          <button type="button" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-gray-700 dark:text-gray-200 text-sm font-bold hover:bg-gray-50 dark:hover:bg-gray-600 transition-all mb-6 shadow-sm hover:shadow">
              <i class="fab fa-apple text-lg mb-[1px]"></i>
              Log in with Apple
          </button>

          <div class="flex items-center gap-3 mb-6">
              <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
              <span class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Or email</span>
              <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
          </div>

          <form action="user.html" method="GET" class="space-y-4">
              <div>
                  <label class="block text-[11px] font-bold text-gray-700 dark:text-gray-300 mb-1.5 uppercase tracking-wider">Email Address</label>
                  <div class="relative group">
                      <div class="absolute inset-y-0 start-0 ps-3.5 flex items-center pointer-events-none transition-colors group-focus-within:text-brand text-gray-400">
                          <i class="fas fa-envelope text-sm"></i>
                      </div>
                      <input type="email" class="w-full bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-600 rounded-xl ps-10 pe-4 py-2.5 transition-all text-sm font-medium text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand" placeholder="sarah@example.com" required>
                  </div>
              </div>
              
              <div>
                  <label class="block text-[11px] font-bold text-gray-700 dark:text-gray-300 mb-1.5 uppercase tracking-wider">Password</label>
                  <div class="relative group">
                      <div class="absolute inset-y-0 start-0 ps-3.5 flex items-center pointer-events-none transition-colors group-focus-within:text-brand text-gray-400">
                          <i class="fas fa-lock text-sm"></i>
                      </div>
                      <input type="password" id="password-input" class="w-full bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-600 rounded-xl ps-10 pe-10 py-2.5 transition-all text-sm font-medium text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand" placeholder="••••••••" required>
                      <button type="button" id="toggle-password" class="absolute inset-y-0 end-0 pe-3.5 flex items-center text-gray-400 hover:text-brand transition-colors">
                          <i class="fas fa-eye text-sm"></i>
                      </button>
                  </div>
              </div>

              <div class="flex items-center justify-between mt-2 mb-4">
                  <label class="flex items-center gap-2 cursor-pointer group mt-0.5">
                      <div class="relative flex items-center justify-center w-4 h-4 border-2 border-gray-300 dark:border-gray-600 rounded group-hover:border-brand transition-colors">
                          <input type="checkbox" class="peer opacity-0 absolute inset-0 cursor-pointer w-full h-full">
                          <i class="fas fa-check text-[10px] text-brand opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                      </div>
                      <span class="text-[12px] font-medium text-gray-500 dark:text-gray-400 select-none">Remember me</span>
                  </label>
                  <a href="#" class="text-[12px] font-bold text-brand hover:text-brand-dark hover:underline transition-colors">Forgot Password?</a>
              </div>

              <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-brand/30 transition-all hover:-translate-y-0.5 text-sm mt-2">
                  Log In
              </button>
          </form>

          <p class="text-center mt-6 text-sm font-medium text-gray-500 dark:text-gray-400">
              Don't have an account yet? 
              <a href="signup.html" class="text-brand font-bold hover:text-brand-dark hover:underline ms-1 transition-colors">Create one now</a>
          </p>
      </div>

      <!-- IMAGE SIDE -->
      <div class="hidden md:flex md:w-1/2 relative bg-brand p-10 text-white flex-col justify-end overflow-hidden">
          <div class="absolute inset-0">
              <img src="images/eldercare (18).jpg" alt="Happy Seniors" class="w-full h-full object-cover opacity-50 mix-blend-overlay hover:scale-105 transition-transform duration-1000">
              <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent opacity-90"></div>
          </div>
          <div class="relative z-10 mt-auto">
              <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-white text-xl mb-6 shadow-xl border border-white/30">
                <i class="fa-solid fa-heart"></i>
              </div>
              <p class="text-2xl font-bold leading-tight mb-6">"Knowing my mother is safe, happy, and well cared for has given our family complete peace of mind."</p>
              
              <div class="flex items-center gap-4">
                  <div class="flex -space-x-4">
                      <img class="w-10 h-10 rounded-full border-2 border-gray-900 object-cover" src="images/eldercare (17).jpg" alt="Family Member">
                      <img class="w-10 h-10 rounded-full border-2 border-gray-900 object-cover" src="images/eldercare (16).jpg" alt="Family Member">
                      <img class="w-10 h-10 rounded-full border-2 border-gray-900 object-cover" src="images/eldercare (15).jpg" alt="Family Member">
                  </div>
                  <div class="text-xs text-gray-300 font-medium">Trusted by 250+ Families</div>
              </div>
          </div>
      </div>

  </div>

  <script>
      // Password toggle
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('password-input');
      
      if(toggleBtn && passInput) {
          toggleBtn.addEventListener('click', () => {
              if (passInput.type === 'password') {
                  passInput.type = 'text';
                  toggleBtn.innerHTML = '<i class="fas fa-eye-slash text-sm"></i>';
              } else {
                  passInput.type = 'password';
                  toggleBtn.innerHTML = '<i class="fas fa-eye text-sm"></i>';
              }
          });
      }

      // Theme logic
      const html = document.documentElement;
      const themeBtn = document.getElementById('darkToggleBtn');
      const savedTheme = localStorage.getItem('theme') || 'light';

      const setDarkMode = (isDark) => {
        if (isDark) {
          html.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          html.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
        if(themeBtn) themeBtn.textContent = isDark ? '☀️' : '🌙';
      };

      if (savedTheme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        setDarkMode(true);
      } else {
        setDarkMode(false);
      }

      if(themeBtn) {
        themeBtn.addEventListener('click', () => setDarkMode(!html.classList.contains('dark')));
      }
  
      // RTL Logic
      const rtlBtn = document.getElementById('rtlToggleBtn'); 
      const currentDir = localStorage.getItem('dir') || 'ltr';
      
      const setRTL = (isRTL) => {
        html.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
        localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
        if(rtlBtn) rtlBtn.textContent = isRTL ? 'LTR' : 'RTL';
      };
      
      if (currentDir === 'rtl') setRTL(true);
      
      if (rtlBtn) {
          rtlBtn.addEventListener('click', () => setRTL(html.getAttribute('dir') !== 'rtl'));
      }
  </script>
</body>
</html>
